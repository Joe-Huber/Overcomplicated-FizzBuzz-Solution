name: Bug report
description: Report something that is not working as expected.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Clear reproduction steps help keep fixes small and focused.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug in a sentence or two.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone reproduce the issue?
      placeholder: |
        1. Build the Docker image with `docker build -t fizzbuzz-test .`
        2. Run `docker run --rm fizzbuzz-test`
        3. See the failure
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Paste relevant command output, stack traces, or screenshots.
      render: shell

  - type: dropdown
    id: environment
    attributes:
      label: How did you run it?
      options:
        - Docker
        - Local Java
        - GitHub Actions
        - Other
    validations:
      required: true

  - type: input
    id: java-version
    attributes:
      label: Java version
      description: If running locally, paste the output of `java -version`.
      placeholder: "Example: openjdk version \"17.0.10\""

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that might help.
